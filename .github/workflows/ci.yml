name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check publication script syntax
        run: python -m compileall -q scripts
      - name: Validate publication metadata JSON
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          paths = sorted(Path('revised').rglob('*.json'))
          assert paths, 'No publication metadata found'
          for path in paths:
              json.loads(path.read_text())
          print(f'Validated {len(paths)} metadata files; PDF rendering is not covered')
          PYTHON
